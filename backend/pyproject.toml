[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic", "pydantic-settings",
  "sqlalchemy>=2", "alembic", "psycopg[binary]", "httpx", "websockets",
  "numpy", "pandas", "pyyaml", "openpyxl", "cryptography", "redis",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "hypothesis", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: needs a reachable Postgres (skipped otherwise)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() defaults

[[tool.mypy.overrides]]
module = ["yaml", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true  # no types-PyYAML: not a chunk dependency

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501"]  # raw SQL
"src/nifty/db/**" = ["E501"]  # raw SQL
"tests/**" = ["E501"]
