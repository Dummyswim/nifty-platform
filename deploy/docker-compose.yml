name: nifty
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.1-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: {context: .., dockerfile: deploy/backend.Dockerfile}
    env_file: [{path: ../.env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: uvicorn nifty.api.main:create_app --factory --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    profiles: [worker]
    build: {context: .., dockerfile: deploy/backend.Dockerfile}
    env_file: [{path: ../.env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: python -m nifty.worker
    depends_on: {db: {condition: service_healthy}}
  collector:
    profiles: [live]
    build: {context: .., dockerfile: deploy/backend.Dockerfile}
    env_file: [{path: ../.env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: python -m nifty.collector
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  web:
    build: {context: .., dockerfile: deploy/web.Dockerfile}
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  dbdata:
  redisdata:
